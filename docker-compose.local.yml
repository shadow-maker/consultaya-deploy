# ConsultaYa · override para correr el modo Docker en tu máquina (paridad con la EC2).
#
# Se usa SIEMPRE junto con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# - nginx en http://localhost:8080 (publicado solo en 127.0.0.1, uso local) y sirve también el build del frontend en "/".
# - Cada servicio usa env/local/<servicio>.env (lo genera scripts/docker-local.sh desde tu .env),
#   que apunta al PostgreSQL de tu máquina mediante host.docker.internal.
# Requiere Compose >= 2.24 (etiqueta !override).

services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../consultaya-frontend/dist:/usr/share/nginx/html:ro

  usuarios:
    env_file: !override
      - env/local/usuarios.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lecciones:
    env_file: !override
      - env/local/lecciones.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  progreso:
    env_file: !override
      - env/local/progreso.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
