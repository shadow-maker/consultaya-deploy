# ConsultaYa · override para correr el modo Docker en la Mac (paridad con la EC2).
#
# Se usa SIEMPRE junto con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# - nginx en http://localhost:8080 y sirve también el build del frontend en "/".
# - Cada servicio usa env/local/<servicio>.env, que apunta al Postgres del host
#   mediante host.docker.internal:5432.
# Requiere Compose >= 2.24 (etiqueta !override).

services:
  nginx:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../consultaya-frontend/dist:/usr/share/nginx/html:ro

  usuarios:
    env_file: !override
      - env/local/usuarios.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lecciones:
    env_file: !override
      - env/local/lecciones.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  progreso:
    env_file: !override
      - env/local/progreso.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
