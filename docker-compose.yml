# ConsultaYa · backend en producción (EC2 con Docker Compose).
#
# nginx (puerto 80) es el único servicio expuesto; usuarios, lecciones y progreso
# escuchan en el 8000 de la red interna de Docker. Cada servicio lee su configuración
# de env/<servicio>.env (copiar desde env/<servicio>.env.example; nunca se commitea).
#
# Seguridad: el puerto 80 queda abierto en la EC2 y se restringe con el security group
# (inbound 80 solo desde la prefix list de CloudFront; ver docs/06-despliegue-aws.md).
#
# Uso: docker compose up -d --build

name: consultaya

x-servicio: &servicio
  restart: unless-stopped
  expose:
    - "8000"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - usuarios
      - lecciones
      - progreso
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  usuarios:
    <<: *servicio
    build: ../consultaya-usuarios
    env_file: env/usuarios.env

  lecciones:
    <<: *servicio
    build: ../consultaya-lecciones
    env_file: env/lecciones.env

  progreso:
    <<: *servicio
    build: ../consultaya-progreso
    env_file: env/progreso.env
    depends_on:
      - lecciones
