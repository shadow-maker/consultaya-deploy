# ConsultaYa · gateway nginx LOCAL (modo Docker, http://localhost:8080).
# Igual que default.conf, más: "/" sirve el build del frontend (SPA con HashRouter).
#
# Expone SOLO:
#   /health                     (respondido por nginx; no depende de los servicios)
#   /api/usuarios/...  -> usuarios:8000
#   /api/lecciones/... -> lecciones:8000
#   /api/progreso/...  -> progreso:8000
#   /                           -> build del frontend (../consultaya-frontend/dist)
# /interno/... (solo para la red de Docker) NO se expone: responde 404.
#
# Los upstreams se resuelven con el DNS interno de Docker (127.0.0.11) en cada petición:
# así nginx arranca aunque un servicio esté caído y sigue funcionando cuando
# deploy-backend.sh recrea un contenedor (cambia su IP).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $consultaya_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $consultaya_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","servicio":"gateway"}';
    }

    location /api/usuarios/ {
        set $upstream_usuarios http://usuarios:8000;
        proxy_pass $upstream_usuarios;
    }

    location /api/lecciones/ {
        set $upstream_lecciones http://lecciones:8000;
        proxy_pass $upstream_lecciones;
    }

    location /api/progreso/ {
        set $upstream_progreso http://progreso:8000;
        proxy_pass $upstream_progreso;
    }

    # /interno/... no sale de la red de Docker.
    location /interno/ {
        default_type application/json;
        return 404 '{"error":{"codigo":"NO_ENCONTRADO","mensaje":"Recurso no encontrado.","campos":null}}';
    }

    # Rutas /api/ desconocidas: 404 JSON (no devolver index.html a un cliente de API).
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"codigo":"NO_ENCONTRADO","mensaje":"Recurso no encontrado.","campos":null}}';
    }

    # Frontend estático (montado desde ../consultaya-frontend/dist).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
